version: "3.1"
services:
    db:
        image: mysql:8.0
        environment:
            MYSQL_ROOT_PASSWORD: 1234
            MYSQL_DATABASE: clash_and_card
        ports:
            - "3307:3306"
        volumes:
            - ${PWD}/db_data:/var/lib/mysql
            - ./initdb:/docker-entrypoint-initdb.d
        networks:
            - clash_and_card_network

volumes:
    db_data:

networks:
    clash_and_card_network:
        external: true
