version: "3.8"

services:
  frontend:
    container_name: clash-and-card-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    environment:
      - VITE_HOST=0.0.0.0
    networks:
      - clash_and_card_network

  backend:
    container_name: clash-and-card-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/.env:/root/.env
    networks:
      - clash_and_card_network

networks:
  clash_and_card_network:
    external: true
